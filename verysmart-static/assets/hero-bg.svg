<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E1F3D"/>
      <stop offset="60%" stop-color="#142845"/>
      <stop offset="100%" stop-color="#1B3B6F"/>
    </linearGradient>
    <linearGradient id="house" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1B3B6F"/>
      <stop offset="100%" stop-color="#08152C"/>
    </linearGradient>
    <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFC580" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#E8842B" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="pool" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A5FA8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0E2A5A" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8842B" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#E8842B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Stars -->
  <g fill="#FFFFFF" opacity="0.7">
    <circle cx="120"  cy="80"  r="1.2"/>
    <circle cx="300"  cy="160" r="1"/>
    <circle cx="480"  cy="60"  r="1.5"/>
    <circle cx="700"  cy="140" r="1"/>
    <circle cx="900"  cy="80"  r="1.3"/>
    <circle cx="1100" cy="180" r="1"/>
    <circle cx="1300" cy="100" r="1.4"/>
    <circle cx="1500" cy="60"  r="1"/>
    <circle cx="200"  cy="220" r="0.9"/>
    <circle cx="1400" cy="200" r="1.1"/>
  </g>

  <!-- Mountains far -->
  <path d="M0 620 L200 540 L380 580 L560 500 L760 560 L960 480 L1180 540 L1380 500 L1600 560 L1600 900 L0 900 Z"
        fill="#0B1A35" opacity="0.6"/>

  <!-- Palm trees silhouettes -->
  <g fill="#08152C">
    <path d="M80 700 Q60 600 90 520 Q120 600 100 700 Z"/>
    <ellipse cx="90" cy="510" rx="30" ry="10" opacity="0.7"/>
    <ellipse cx="70" cy="525" rx="25" ry="8" opacity="0.6"/>
    <ellipse cx="115" cy="520" rx="28" ry="9" opacity="0.7"/>
    <path d="M1480 720 Q1465 620 1490 540 Q1515 620 1500 720 Z"/>
    <ellipse cx="1490" cy="530" rx="30" ry="10" opacity="0.7"/>
    <ellipse cx="1465" cy="545" rx="25" ry="8" opacity="0.6"/>
    <ellipse cx="1515" cy="540" rx="28" ry="9" opacity="0.7"/>
  </g>

  <!-- House structure (modern villa silhouette) -->
  <g>
    <!-- Main building -->
    <rect x="380" y="380" width="840" height="320" fill="url(#house)"/>
    <!-- Upper floor projection -->
    <rect x="420" y="340" width="500" height="60" fill="#0E2545"/>
    <!-- Top edge -->
    <rect x="380" y="370" width="840" height="14" fill="#08152C"/>
    <!-- Lower terrace -->
    <rect x="340" y="690" width="920" height="40" fill="#050E1F"/>

    <!-- Large picture windows (warm light) -->
    <rect x="420" y="420" width="160" height="230" fill="url(#window)" opacity="0.9"/>
    <rect x="600" y="420" width="160" height="230" fill="url(#window)" opacity="0.85"/>
    <rect x="780" y="420" width="160" height="230" fill="url(#window)" opacity="0.9"/>
    <rect x="960" y="420" width="220" height="230" fill="url(#window)" opacity="0.88"/>

    <!-- Window mullions -->
    <g stroke="#08152C" stroke-width="3">
      <line x1="500" y1="420" x2="500" y2="650"/>
      <line x1="680" y1="420" x2="680" y2="650"/>
      <line x1="860" y1="420" x2="860" y2="650"/>
      <line x1="1070" y1="420" x2="1070" y2="650"/>
      <line x1="420" y1="535" x2="1180" y2="535"/>
    </g>
    <!-- Roof beam -->
    <rect x="370" y="356" width="860" height="10" fill="#06122B"/>
  </g>

  <!-- Pool with reflection -->
  <rect x="250" y="740" width="1100" height="120" fill="url(#pool)"/>
  <g opacity="0.45">
    <rect x="420" y="745" width="160" height="100" fill="#E8842B"/>
    <rect x="600" y="745" width="160" height="100" fill="#E8842B"/>
    <rect x="780" y="745" width="160" height="100" fill="#E8842B"/>
    <rect x="960" y="745" width="220" height="100" fill="#E8842B"/>
  </g>
  <!-- Water ripples -->
  <g stroke="#FFFFFF" stroke-width="1" fill="none" opacity="0.25">
    <path d="M300 790 Q400 785 500 790 T700 790 T900 790 T1100 790 T1300 790"/>
    <path d="M300 820 Q400 815 500 820 T700 820 T900 820 T1100 820 T1300 820"/>
  </g>

  <!-- Foreground glow -->
  <ellipse cx="800" cy="650" rx="600" ry="120" fill="url(#glow)"/>

  <!-- Ground -->
  <rect x="0" y="850" width="1600" height="50" fill="#040A18"/>
</svg>
