<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Smart home control panel">
  <defs>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A1A1A"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E2A47"/>
      <stop offset="100%" stop-color="#08152C"/>
    </linearGradient>
  </defs>
  <!-- Tablet body -->
  <rect x="10" y="20" width="380" height="260" rx="20" fill="url(#bezel)" stroke="#333" stroke-width="1.5"/>
  <!-- Screen -->
  <rect x="25" y="35" width="350" height="230" rx="10" fill="url(#screen)"/>
  <!-- Header -->
  <text x="45" y="65" fill="#FFFFFF" font-family="Poppins,sans-serif" font-weight="600" font-size="14">Living Room</text>
  <text x="355" y="65" fill="#E8842B" font-family="Poppins,sans-serif" font-weight="700" font-size="20" text-anchor="end">22°</text>

  <!-- Tiles row 1 -->
  <g>
    <rect x="45"  y="85" width="95" height="75" rx="10" fill="#FFFFFF" opacity="0.08"/>
    <circle cx="92" cy="115" r="14" fill="#E8842B"/>
    <path d="M92 109 v6 m-3 -3 h6" stroke="#0E1F3D" stroke-width="2" stroke-linecap="round"/>
    <text x="92" y="148" fill="#FFFFFF" font-family="Poppins,sans-serif" font-size="10" text-anchor="middle">Lights</text>

    <rect x="152" y="85" width="95" height="75" rx="10" fill="#FFFFFF" opacity="0.08"/>
    <circle cx="200" cy="115" r="14" fill="#1B5FBF"/>
    <rect x="194" y="109" width="12" height="12" rx="2" fill="#FFFFFF"/>
    <text x="200" y="148" fill="#FFFFFF" font-family="Poppins,sans-serif" font-size="10" text-anchor="middle">Climate</text>

    <rect x="260" y="85" width="95" height="75" rx="10" fill="#FFFFFF" opacity="0.08"/>
    <circle cx="307" cy="115" r="14" fill="#E8842B"/>
    <path d="M301 115 l4 4 l7 -8" stroke="#0E1F3D" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <text x="307" y="148" fill="#FFFFFF" font-family="Poppins,sans-serif" font-size="10" text-anchor="middle">Security</text>
  </g>

  <!-- Tiles row 2 -->
  <g>
    <rect x="45"  y="175" width="95" height="75" rx="10" fill="#FFFFFF" opacity="0.08"/>
    <circle cx="92" cy="205" r="14" fill="#1B5FBF"/>
    <path d="M86 199 v12 m12 -12 v12 M86 205 h12" stroke="#FFFFFF" stroke-width="2"/>
    <text x="92" y="238" fill="#FFFFFF" font-family="Poppins,sans-serif" font-size="10" text-anchor="middle">Blinds</text>

    <rect x="152" y="175" width="95" height="75" rx="10" fill="#FFFFFF" opacity="0.08"/>
    <circle cx="200" cy="205" r="14" fill="#E8842B"/>
    <path d="M194 205 q3 -6 6 0 t6 0" stroke="#0E1F3D" stroke-width="2" fill="none"/>
    <text x="200" y="238" fill="#FFFFFF" font-family="Poppins,sans-serif" font-size="10" text-anchor="middle">Audio</text>

    <rect x="260" y="175" width="95" height="75" rx="10" fill="#FFFFFF" opacity="0.08"/>
    <circle cx="307" cy="205" r="14" fill="#1B5FBF"/>
    <circle cx="307" cy="205" r="5" fill="#FFFFFF"/>
    <text x="307" y="238" fill="#FFFFFF" font-family="Poppins,sans-serif" font-size="10" text-anchor="middle">Camera</text>
  </g>
</svg>
